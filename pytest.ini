[pytest]
# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
# Coverage is NOT here on purpose. It was in addopts, so every run -- including
# a single test during a fix loop -- instrumented all of src/ and wrote an HTML
# report. That is a few seconds a run and it discourages running the suite,
# which is the opposite of what a test config should do. CI asks for coverage
# explicitly:
#
#     pytest --cov=src --cov-report=term-missing --cov-branch
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# Markers (custom test categories)
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (moderate speed, multiple components)
    system: System tests (slow, end-to-end)
    ml: Machine learning tests
    api: API endpoint tests
    performance: Performance tests
    slow: Slow running tests
    smoke: Quick smoke tests
